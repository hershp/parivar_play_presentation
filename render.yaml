services:
  - type: web
    name: parivar-play
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.14.1
